spring.application.name=restaurant-management-billing
server.port=${PORT:8080}

# ---------- MySQL (default) ----------
# Credentials come from environment variables; never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Security ----------
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---------- Loyalty ----------
app.loyalty.earn-per-amount=100
app.loyalty.point-value=1
app.loyalty.max-redeem-percent=50
app.loyalty.signup-bonus=50

# ---------- Payment gateway (sandbox) ----------
app.payment.gateway-secret=${PAYMENT_GATEWAY_SECRET:sandbox-gateway-secret}

# ---------- Notifications ----------
# Set MAIL_ENABLED=true and the SMTP variables to send real emails. Otherwise emails/SMS are simulated and logged.
app.notification.email-enabled=${MAIL_ENABLED:false}
app.notification.from=${MAIL_FROM:no-reply@restaurant.local}
app.notification.sms-provider=log
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ---------- Demo data ----------
app.seed-demo-data=${SEED_DEMO_DATA:true}
