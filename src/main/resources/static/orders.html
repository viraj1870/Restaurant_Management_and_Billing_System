<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h3 class="mb-3"><i class="bi bi-receipt text-brand"></i> My orders</h3>
    <div id="list"><div class="text-center py-5"><div class="spinner-border text-secondary"></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    App.requireRole('CUSTOMER');
    App.renderNav('/orders.html');
    const { esc, money } = App;
    async function load() {
        try {
            const orders = await App.api('/api/orders/my');
            document.getElementById('list').innerHTML = orders.length ? `
              <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Order</th><th>Restaurant</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr></thead>
                <tbody>${orders.map(o => `<tr role="button" onclick="location.href='/order.html?id=${o.id}'">
                  <td><strong>#${esc(o.orderNumber)}</strong><div class="small text-muted">${App.dt(o.createdAt)}</div></td>
                  <td>${esc(o.restaurantName)}</td>
                  <td class="small">${o.items.map(i => esc(i.itemName) + ' x' + i.quantity).join(', ')}</td>
                  <td class="fw-semibold">${money(o.totalAmount)}</td>
                  <td>${App.statusBadge(o.status)}</td><td>${App.payBadge(o.paymentStatus)}</td>
                  <td>${o.status === 'COMPLETED' && !o.feedbackGiven ? '<span class="badge text-bg-warning">Rate now</span>' : ''}</td>
                </tr>`).join('')}</tbody></table></div></div>`
              : `<div class="text-center py-5 text-muted"><i class="bi bi-bag display-4 d-block mb-2"></i>No orders yet.
                 <div class="mt-3"><a class="btn btn-brand" href="/restaurants.html">Browse restaurants</a></div></div>`;
        } catch (e) { App.error(e); }
    }
    load();
    setInterval(load, 15000);
</script>
</body>
</html>
