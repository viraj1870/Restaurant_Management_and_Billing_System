<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container">
    <div class="card auth-card">
        <div class="card-body p-4">
            <h3 class="mb-1 text-center"><i class="bi bi-box-arrow-in-right text-brand"></i> Sign in</h3>
            <p class="text-center text-muted small">Merchant, customer and kitchen staff sign in here</p>
            <div id="expired" class="alert alert-warning d-none small">Your session expired. Please sign in again.</div>
            <form id="loginForm" novalidate>
                <div class="alert alert-danger d-none form-alert small"></div>
                <div class="mb-3">
                    <label class="form-label">Email or Mobile</label>
                    <input name="login" class="form-control" required autocomplete="username" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input name="password" type="password" class="form-control" required autocomplete="current-password">
                </div>
                <button class="btn btn-brand w-100" type="submit"><i class="bi bi-lock"></i> Sign in</button>
            </form>
            <hr>
            <p class="text-center mb-0 small">New here? <a href="/signup.html">Create a customer account</a> or
                <a href="/signup.html?role=merchant">register your restaurant</a></p>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    App.renderNav();
    const params = new URLSearchParams(location.search);
    if (params.get('expired')) document.getElementById('expired').classList.remove('d-none');
    const form = document.getElementById('loginForm');
    form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button');
        btn.disabled = true;
        try {
            const auth = await App.api('/api/auth/signin', { method: 'POST', auth: false, body: App.formData(form) });
            App.setSession(auth);
            const next = params.get('next');
            // Only allow same-site relative redirects.
            location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : App.homeFor(auth.user.role);
        } catch (err) {
            App.showFormErrors(form, err);
        } finally { btn.disabled = false; }
    };
</script>
</body>
</html>
