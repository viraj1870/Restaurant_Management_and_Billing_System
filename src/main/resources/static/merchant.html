<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merchant Dashboard - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container-fluid px-lg-4 py-4">
    <div class="row g-4">
        <div class="col-lg-2">
            <div class="card sidebar"><div class="card-body p-2">
                <div class="px-2 py-1 mb-2"><div class="small text-muted">Restaurant</div><strong id="restName">-</strong></div>
                <nav class="nav flex-column gap-1" id="tabs">
                    <a class="nav-link active" href="#dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    <a class="nav-link" href="#orders"><i class="bi bi-receipt"></i> Orders &amp; Billing</a>
                    <a class="nav-link" href="#menu"><i class="bi bi-journal-text"></i> Menu</a>
                    <a class="nav-link" href="#coupons"><i class="bi bi-tags"></i> Coupons</a>
                    <a class="nav-link" href="#customers"><i class="bi bi-people"></i> Customers</a>
                    <a class="nav-link" href="#feedback"><i class="bi bi-chat-square-text"></i> Feedback</a>
                    <a class="nav-link" href="#reports"><i class="bi bi-graph-up"></i> Reports</a>
                    <a class="nav-link" href="#payments"><i class="bi bi-cash-coin"></i> Payments</a>
                    <a class="nav-link" href="#notifications"><i class="bi bi-bell"></i> Notifications</a>
                    <a class="nav-link" href="#staff"><i class="bi bi-person-badge"></i> Kitchen Staff</a>
                    <a class="nav-link" href="#profile"><i class="bi bi-gear"></i> Restaurant Profile</a>
                </nav>
            </div></div>
        </div>
        <div class="col-lg-10" id="view"></div>
    </div>
</main>

<!-- Generic form modal -->
<div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="formTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="modalForm" novalidate>
            <div class="modal-body"><div class="alert alert-danger d-none form-alert small"></div><div class="row g-3" id="formBody"></div></div>
            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" type="submit">Save</button></div>
        </form>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/merchant.js"></script>
</body>
</html>
