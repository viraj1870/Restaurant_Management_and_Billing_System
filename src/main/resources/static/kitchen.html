<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Board - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container-fluid px-lg-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-fire text-brand"></i> Kitchen board</h3>
        <div class="small text-muted"><i class="bi bi-arrow-repeat"></i> Auto-refresh every 10s &middot; <span id="updated"></span></div>
    </div>
    <div class="row g-3">
        <div class="col-md-4"><div class="kitchen-col"><h6 class="text-uppercase">Pending <span class="badge bg-warning text-dark" id="c-PENDING">0</span></h6><div id="col-PENDING"></div></div></div>
        <div class="col-md-4"><div class="kitchen-col"><h6 class="text-uppercase">Preparing <span class="badge bg-primary" id="c-PREPARING">0</span></h6><div id="col-PREPARING"></div></div></div>
        <div class="col-md-4"><div class="kitchen-col"><h6 class="text-uppercase">Ready <span class="badge bg-success" id="c-READY">0</span></h6><div id="col-READY"></div></div></div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    const user = App.requireRole('KITCHEN', 'MERCHANT');
    App.renderNav('/kitchen.html');
    const { esc } = App;
    let known = null;

    function card(o) {
        const btns = [];
        if (o.status === 'PENDING') btns.push(`<button class="btn btn-sm btn-primary" onclick="setStatus(${o.id},'PREPARING')"><i class="bi bi-fire"></i> Start preparing</button>`);
        if (o.status === 'PREPARING') btns.push(`<button class="btn btn-sm btn-success" onclick="setStatus(${o.id},'READY')"><i class="bi bi-bell"></i> Mark ready</button>`);
        if (o.status === 'READY' && user.role === 'MERCHANT') btns.push(`<button class="btn btn-sm btn-dark" onclick="setStatus(${o.id},'COMPLETED')" ${o.paymentStatus !== 'PAID' ? 'disabled title="Payment pending"' : ''}><i class="bi bi-check2-all"></i> Complete</button>`);
        return `<div class="card kitchen-card ${o.status} mb-2"><div class="card-body p-2">
            <div class="d-flex justify-content-between"><strong>#${esc(o.orderNumber.slice(-6))}</strong><span class="small text-muted">${App.timeAgo(o.createdAt)}</span></div>
            <div class="small text-muted">${App.label(o.orderType)}${o.tableNumber ? ' &middot; Table ' + esc(o.tableNumber) : ''} &middot; ${esc(o.customerName)}</div>
            <ul class="list-unstyled small my-2">${o.items.map(i => `<li><strong>${i.quantity} x</strong> ${esc(i.itemName)}</li>`).join('')}</ul>
            ${o.specialInstructions ? `<div class="small alert alert-warning py-1 px-2 mb-2"><i class="bi bi-chat-left-text"></i> ${esc(o.specialInstructions)}</div>` : ''}
            <div class="d-flex gap-1 flex-wrap align-items-center">${btns.join('')} ${user.role === 'MERCHANT' ? App.payBadge(o.paymentStatus) : ''}</div>
        </div></div>`;
    }

    async function load() {
        try {
            const orders = await App.api('/api/kitchen/orders');
            ['PENDING', 'PREPARING', 'READY'].forEach(s => {
                const list = orders.filter(o => o.status === s);
                document.getElementById('col-' + s).innerHTML = list.map(card).join('') || '<p class="small text-muted text-center my-4">No orders</p>';
                document.getElementById('c-' + s).textContent = list.length;
            });
            const ids = new Set(orders.filter(o => o.status === 'PENDING').map(o => o.id));
            if (known && [...ids].some(id => !known.has(id))) App.toast('New order received!', 'warning');
            known = ids;
            document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
        } catch (e) { App.error(e); }
    }

    window.setStatus = async (id, status) => {
        try { await App.api(`/api/orders/${id}/status`, { method: 'PUT', body: { status } }); App.toast('Order updated to ' + App.label(status)); load(); }
        catch (e) { App.error(e); }
    };

    load();
    setInterval(load, 10000);
</script>
</body>
</html>
