<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurants - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="bi bi-shop text-brand"></i> Restaurants</h3>
        <input id="search" class="form-control" style="max-width:280px" placeholder="Search by name or cuisine">
    </div>
    <div id="list" class="row g-4"><div class="text-center py-5"><div class="spinner-border text-secondary"></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    App.renderNav('/restaurants.html');
    let all = [];
    const { esc } = App;
    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const items = all.filter(r => (r.name + ' ' + (r.cuisine || '')).toLowerCase().includes(q));
        document.getElementById('list').innerHTML = items.length ? items.map(r => `
          <div class="col-md-6 col-lg-4">
            <a href="/menu.html?restaurantId=${r.id}" class="text-decoration-none text-dark">
              <div class="card h-100 card-hover">
                <div class="card-body">
                  <div class="d-flex justify-content-between">
                    <h5 class="card-title mb-1">${esc(r.name)}</h5>
                    ${r.averageRating ? `<span class="badge bg-success"><i class="bi bi-star-fill"></i> ${r.averageRating} (${r.ratingCount})</span>` : '<span class="badge bg-light text-muted">New</span>'}
                  </div>
                  <div class="text-muted small mb-2">${esc(r.cuisine || 'Multi-cuisine')}</div>
                  <p class="small mb-2">${esc(r.description || '')}</p>
                  <div class="small text-muted"><i class="bi bi-geo-alt"></i> ${esc(r.address || '-')}</div>
                </div>
                <div class="card-footer bg-white border-0">
                  ${r.acceptingOrders ? '<span class="text-success small"><i class="bi bi-circle-fill"></i> Accepting orders</span>'
                                      : '<span class="text-danger small"><i class="bi bi-circle-fill"></i> Not accepting orders</span>'}
                </div>
              </div>
            </a>
          </div>`).join('') : '<p class="text-muted text-center py-5">No restaurants found.</p>';
    }
    document.getElementById('search').oninput = render;
    App.api('/api/restaurants', { auth: false }).then(d => { all = d; render(); }).catch(App.error);
</script>
</body>
</html>
