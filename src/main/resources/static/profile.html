<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile & Rewards - RestoBill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card mb-4"><div class="card-body">
                <h5><i class="bi bi-person-circle text-brand"></i> My profile</h5>
                <form id="profileForm" novalidate>
                    <div class="mb-2"><label class="form-label small">Name</label><input name="name" class="form-control" required></div>
                    <div class="mb-2"><label class="form-label small">Email</label><input id="email" class="form-control" disabled></div>
                    <div class="mb-2"><label class="form-label small">Mobile</label><input name="mobile" class="form-control" required maxlength="10"></div>
                    <div class="mb-2"><label class="form-label small">Address</label><input name="address" class="form-control"></div>
                    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="notificationConsent" id="consent">
                        <label class="form-check-label small" for="consent">Receive order &amp; payment updates by email/SMS</label></div>
                    <button class="btn btn-brand">Save</button>
                </form>
            </div></div>
            <div class="card"><div class="card-body">
                <h5><i class="bi bi-key text-brand"></i> Change password</h5>
                <form id="pwForm" novalidate>
                    <div class="mb-2"><input name="currentPassword" type="password" class="form-control" placeholder="Current password" required></div>
                    <div class="mb-2"><input name="newPassword" type="password" class="form-control" placeholder="New password" required></div>
                    <button class="btn btn-outline-dark">Update password</button>
                </form>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card mb-4 text-white" style="background:linear-gradient(135deg,#d9480f,#fab005)"><div class="card-body d-flex justify-content-between align-items-center">
                <div><div class="small">Loyalty points balance</div><div class="display-5 fw-bold" id="balance">0</div>
                    <div class="small" id="rules"></div></div>
                <i class="bi bi-gift display-3"></i>
            </div></div>
            <div class="card mb-4"><div class="card-body">
                <h6>Points history</h6>
                <div id="history" class="small"></div>
            </div></div>
            <div class="card mb-4"><div class="card-body">
                <h6>My feedback &amp; complaints</h6>
                <div id="feedback" class="small"></div>
            </div></div>
            <div class="card"><div class="card-body">
                <h6>Notifications</h6>
                <div id="notifications" class="small"></div>
            </div></div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    App.requireRole('CUSTOMER');
    App.renderNav('/profile.html');
    const { esc } = App;
    const pf = document.getElementById('profileForm');

    async function load() {
        const me = await App.api('/api/users/me');
        pf.name.value = me.name; pf.mobile.value = me.mobile; pf.address.value = me.address || '';
        pf.notificationConsent.checked = me.notificationConsent;
        document.getElementById('email').value = me.email;

        const l = await App.api('/api/customer/loyalty');
        document.getElementById('balance').textContent = l.balance;
        document.getElementById('rules').textContent = `Earn 1 point per \u20B9${l.earnRateAmount} spent. 1 point = \u20B91. Use up to ${l.maxRedeemPercent}% of a bill.`;
        document.getElementById('history').innerHTML = l.transactions.length ? `<table class="table table-sm mb-0">
            <thead><tr><th>Date</th><th>Details</th><th class="text-end">Points</th><th class="text-end">Balance</th></tr></thead>
            <tbody>${l.transactions.map(t => `<tr><td>${App.dt(t.createdAt)}</td><td>${esc(t.description || App.label(t.type))}</td>
              <td class="text-end ${t.points > 0 ? 'text-success' : 'text-danger'}">${t.points > 0 ? '+' : ''}${t.points}</td><td class="text-end">${t.balanceAfter}</td></tr>`).join('')}</tbody></table>`
            : '<span class="text-muted">No transactions yet.</span>';

        const fb = await App.api('/api/feedback/my');
        document.getElementById('feedback').innerHTML = fb.length ? fb.map(f => `
          <div class="border-bottom py-2"><div class="d-flex justify-content-between">
            <span><span class="badge ${f.type === 'COMPLAINT' ? 'text-bg-danger' : 'text-bg-success'}">${App.label(f.type)}</span>
              ${esc(f.restaurantName)} ${f.orderNumber ? '&middot; #' + esc(f.orderNumber) : ''}</span>
            <span class="badge text-bg-light">${App.label(f.status)}</span></div>
            ${f.rating ? App.stars(f.rating) : ''}<div>${esc(f.comment || '')}</div>
            ${f.merchantReply ? `<div class="ms-3 fst-italic text-muted"><i class="bi bi-reply"></i> ${esc(f.merchantReply)}</div>` : ''}</div>`).join('')
            : '<span class="text-muted">No feedback submitted yet.</span>';

        const notes = await App.api('/api/customer/notifications');
        document.getElementById('notifications').innerHTML = notes.length ? notes.slice(0, 20).map(n => `
          <div class="border-bottom py-1"><i class="bi bi-${n.channel === 'EMAIL' ? 'envelope' : 'phone'}"></i>
            <strong>${esc(n.subject || '')}</strong> <span class="text-muted">&middot; ${App.timeAgo(n.createdAt)} &middot; ${App.label(n.status)}</span>
            <div class="text-muted">${esc(n.message || '')}</div></div>`).join('') : '<span class="text-muted">No notifications yet.</span>';
    }

    pf.onsubmit = async (e) => {
        e.preventDefault();
        try {
            const me = await App.api('/api/users/me', { method: 'PUT', body: App.formData(pf) });
            App.setUser(me); App.toast('Profile updated');
        } catch (err) { App.showFormErrors(pf, err); }
    };
    const pw = document.getElementById('pwForm');
    pw.onsubmit = async (e) => {
        e.preventDefault();
        try { await App.api('/api/users/me/password', { method: 'PUT', body: App.formData(pw) }); pw.reset(); App.toast('Password updated'); }
        catch (err) { App.showFormErrors(pw, err); }
    };
    load().catch(App.error);
</script>
</body>
</html>
