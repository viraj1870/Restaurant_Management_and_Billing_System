services:
  - type: web
    name: restobill
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/restaurants
    envVars:
      # Fill these in the Render dashboard (values are never stored in Git)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_GATEWAY_SECRET
        generateValue: true
